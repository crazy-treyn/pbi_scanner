name: WASM Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: wasm-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-smoke:
    name: smoke (${{ matrix.duckdb_platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # DuckDB-Wasm 2.0 dropped the MVP bundle. Browser smoke loads wasm_eh only.
        duckdb_platform: [wasm_eh]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: test/wasm/package-lock.json

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.9

      - name: Install host build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ccache

      - name: Build WASM extension
        env:
          OVERRIDE_GIT_DESCRIBE: v2.0.0
        run: make ${{ matrix.duckdb_platform }}

      - name: Build DuckDB-Wasm host
        env:
          OVERRIDE_GIT_DESCRIBE: v2.0.0
        run: bash test/wasm/ensure_duckdb_wasm_host.sh

      - name: Install WASM smoke dependencies
        run: npm ci
        working-directory: test/wasm

      - name: Install browser smoke runtime
        run: npx playwright install --with-deps chromium
        working-directory: test/wasm

      - name: Run WASM smoke test
        env:
          PBI_WASM_EXTENSION_PATH: build/${{ matrix.duckdb_platform }}/extension/pbi_scanner/pbi_scanner.duckdb_extension.wasm
          PBI_WASM_DUCKDB_PLATFORM: ${{ matrix.duckdb_platform }}
          PBI_DUCKDB_WASM_DIST: ${{ github.workspace }}/test/wasm/.duckdb-wasm/packages/duckdb-wasm/dist
        run: node smoke.mjs
        working-directory: test/wasm

      - name: Run WASM sqllogictest
        env:
          PBI_WASM_EXTENSION_PATH: build/${{ matrix.duckdb_platform }}/extension/pbi_scanner/pbi_scanner.duckdb_extension.wasm
          PBI_WASM_DUCKDB_PLATFORM: ${{ matrix.duckdb_platform }}
          PBI_DUCKDB_WASM_DIST: ${{ github.workspace }}/test/wasm/.duckdb-wasm/packages/duckdb-wasm/dist
        run: node run_sqllogictest.mjs --test ../../wasm_sql/pbi_scanner_wasm.test
        working-directory: test/wasm
